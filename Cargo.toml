[workspace]
resolver = "2"
members = ["crates/hiveproxy-core", "crates/hiveproxy-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/example/hiveproxy"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
petgraph = "0.6"
dashmap = "6"
parking_lot = "0.12"
arc-swap = "1"
ipnet = { version = "2", features = ["serde"] }
socket2 = "0.5"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
if-addrs = "0.13"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
